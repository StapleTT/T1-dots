# macOS / Linux hybrid: the macOS Terminal layout (user@host dir, then % on its own line for input), plain text instead of pills,
# with Linux touches: Arch logo, git branch and status, command time and exit code on the right.
# Colours are the kitty theme's (~/.config/kitty/theme.conf): 15 white, 7 light grey, 8 grey, 9 red.

add_newline = true # a blank line between commands
format = """
$os$username$hostname $directory$git_branch$git_status$git_state
$character"""
right_format = "$cmd_duration$status"

[os]
disabled = false
style = "fg:7"
format = "[$symbol]($style)"

