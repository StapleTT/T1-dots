[username]
show_always = true
style_user = "bold fg:15"
style_root = "bold fg:9"
format = "[$user]($style)"

[hostname]
ssh_symbol = " "
ssh_only = false
style = "fg:8"
format = "[@$hostname( $ssh_symbol)]($style)" # SSH icon only over SSH

[directory]
style = "bold fg:15"
read_only = " 󰌾"
read_only_style = "fg:8"
home_symbol = "~"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style)"

[git_branch]
symbol = " "
style = "fg:7"
format = "[ $symbol$branch]($style)"

# Nerd Font icons (Font Awesome set), with counts where useful
[git_status]
style = "fg:8"
format = "([ $all_status$ahead_behind]($style))"
conflicted = "\uf071 ${count} "
ahead = "\uf062${count} "
behind = "\uf063${count} "
diverged = "\uf0ec \uf062${ahead_count} \uf063${behind_count} "
untracked = "\uf128${count} "
stashed = "\uf01c ${count} "
modified = "\uf040 ${count} "
staged = "\uf067${count} "
renamed = "\uf061 ${count} "
deleted = "\uf1f8 ${count} "

[git_state]
style = "fg:11"
format = ' [\($state( $progress_current/$progress_total)\)]($style)'

# Input line: macOS zsh's % (white, red after a failed command); also what transient prompt leaves behind
[character]
success_symbol = "[%](bold fg:15)"
error_symbol = "[%](bold fg:9)"
vimcmd_symbol = "[%](bold fg:10)"

[cmd_duration]
min_time = 2000
style = "fg:8"
format = "[$duration]($style)"

[status]
symbol = " "
disabled = false
style = "fg:9"
format = "[ $symbol$status]($style)"

[package]
symbol = "󰏗 "
disabled = true

