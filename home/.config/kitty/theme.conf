# Monochrome theme matching the Quickshell bar: dark grey background (translucent, see background_opacity),
# off-white text, grey selection like the launcher's highlighted row. ANSI colours are Apple's dark-mode
# system colours, the same red/green/yellow used in the GTK and KDE themes.

background            #1a1a1a
foreground            #f2f2f2
cursor                #ffffff
cursor_text_color     #000000
selection_background  #3a3a3c
selection_foreground  #ffffff
url_color             #64d2ff

# black, red, green, yellow, blue, magenta, cyan, white
color0                #1c1c1e
color1                #ff453a
color2                #30d158
color3                #ffd60a
color4                #0a84ff
color5                #bf5af2
color6                #64d2ff
color7                #d1d1d6
# bright
color8                #636366
color9                #ff6961
color10               #4ae07b
color11               #ffe066
color12               #409cff
color13               #da8fff
color14               #8ae0ff
color15               #ffffff

