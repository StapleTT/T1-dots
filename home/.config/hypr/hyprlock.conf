# Lock screen matching the Quickshell bar: wallpaper only, clock just above centre,
# black pill password field near the bottom. Esc / Ctrl+U clear the field.

$font = Rubik

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

# Same image as hyprpaper.conf; update both when changing wallpaper
background {
    monitor =
    path = ~/Pictures/Wallpapers/27-Golden-Gate.png
    blur_passes = 0
}

# TIME (just above centre)
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.35)

    position = 0, 150
    halign = center
    valign = center
}

# DATE (above the time)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 22
    font_family = $font Medium
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)

    position = 0, 260
    halign = center
    valign = center
}

# PASSWORD (bottom centre), styled like the bar's black pills
input-field {
    monitor =
    size = 300, 46
    rounding = -1
    outline_thickness = 0
    inner_color = rgba(0, 0, 0, 0.85)
    check_color = rgba(0, 0, 0, 0.85)
    fail_color = rgba(255, 105, 97, 0.9)
    font_color = rgb(255, 255, 255)
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff66">Password</span>
    fail_text = <span foreground="##ffffff">$PAMFAIL</span>
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.4)

    position = 0, 140
    halign = center
    valign = bottom
}
