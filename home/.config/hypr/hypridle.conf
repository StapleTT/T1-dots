# Idle: lock after 5 min, screen off 30 s later. Lock before suspend.

general {
    lock_cmd = qs ipc call lock lock                                  # Quickshell lock screen (shell.qml)
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen back on after resume
}

listener {
    timeout = 300                         # 5 min
    on-timeout = loginctl lock-session    # runs lock_cmd
}

listener {
    timeout = 330                                                 # 5.5 min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})' # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'   # screen on at any input
}
